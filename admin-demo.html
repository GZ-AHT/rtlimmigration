 document.getElementById('content').innerHTML=`${head(p,action)}<div class="grid stats">${cards.map((c,i)=>`<div class="card stat"><div class="stathead">${c[0]} <span class="staticon"><span class="material-symbols-outlined">${c[2]}</span></span></div><div class="statnum">${c[1]}</div><div class="trend">${i===3?'Navigate this module':'Live demo summary'} <span style="color:var(--muted)">· ${p[1]}</span></div></div>`).join('')}</div><div class="grid dashgrid"><div class="card panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h3>${p[1]} overview</h3><div class="muted">A quick snapshot of this section</div></div><span class="pill">Updated just now</span></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:20px">${quick.map(q=>`<button class="btn" style="min-height:74px;text-align:left;display:flex;align-items:center;gap:10px" onclick="go('${q[0]}')"><span class="material-symbols-outlined" style="font-size:22px;color:var(--red)">${iconFor(q[0])}</span><span>${q[3]}<small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">Open section</small></span></button>`).join('')}</div></div><div class="card panel"><h3>At a glance</h3><div class="queueitem"><div class="tile"><span class="material-symbols-outlined">check_circle</span></div><div><b>Completed / active</b><small>Records in good standing</small></div><span class="count">${done}</span></div><div class="queueitem"><div class="tile"><span class="material-symbols-outlined">schedule</span></div><div><b>Needs attention</b><small>Pending, review or open items</small></div><span class="count">${pending}</span></div><button class="btn soft" style="width:100%;margin-top:10px" onclick="go('${quick[0]?.[0]||'overview'}')">View module details <span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">arrow_forward</span></button></div></div><div class="card panel" style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3>Recent ${p[1]} records</h3><div class="muted">Latest entries available in this demo</div></div><button class="btn" onclick="go('${quick.find(q=>!['Dashboard'].includes(q[3]))?.[0]||'overview'}')">View all</button></div><div style="overflow:auto;margin-top:14px">${tableHTML(key,rows.slice(0,5),false)}</div></div>`;
}
function iconFor(id){return ({'email-inbox':'inbox','email-sent':'send','email-compose':'edit','blog-posts':'article','blog-create':'post_add','pages-all':'web','pages-new':'add_box','users-all':'group','tickets-all':'confirmation_number','counselor-all':'support_agent','students-all':'school','work-all':'work','universities-all':'account_balance','petrep-all':'description','visa-all':'flight_takeoff','chat-live':'forum','settings-general':'settings','accounts-bill':'receipt_long','accounts-fee':'payments'})[id]||'folder_open'}
function renderDash(){document.getElementById('content').innerHTML=`${head(pages[0],'<button class="btn" onclick="notify(\'Showing November 2026\')">▦ &nbsp;01 – 30 November 2026</button><button class="btn primary" onclick="go(\'students-all\');openModal()">＋ Add student</button>')}<div class="grid stats"><div class="card stat"><div class="stathead">Total students <span class="staticon">♧</span></div><div class="statnum">2,486</div><div class="trend">↗ 12.8% <span style="color:var(--muted)">vs. last month</span></div></div><div class="card stat"><div class="stathead">Applications <span class="staticon">▤</span></div><div class="statnum">186</div><div class="trend">32 pending <span style="color:var(--muted)">awaiting approval</span></div></div><div class="card stat"><div class="stathead">Fees collected <span class="staticon">▣</span></div><div class="statnum" style="font-size:25px">BDT 1,284,500</div><div class="trend">↗ 8.2% <span style="color:var(--muted)">vs. last month</span></div></div><div class="card stat"><div class="stathead">Active counselors <span class="staticon">♙</span></div><div class="statnum">24</div><div class="trend">4 online <span style="color:var(--muted)">available now</span></div></div></div><div class="grid dashgrid"><div class="card panel"><h3>Application activity</h3><div class="muted">Applications received over time</div><div style="margin-top:20px"><b style="font:800 29px Manrope">186</b> <span class="muted">applications</span> <span class="trend">+18.4%</span></div><div class="chart">${[35,48,42,60,52,72,58,83,69,95,78,88,66,100,82,91,74,96,68,86].map((n,i)=>`<div class="bar" style="height:${n}%"><span>${i%4===0?['01','08','15','22','30'][i/4]:''}</span></div>`).join('')}</div></div><div class="card panel"><h3>Needs your attention</h3><div class="muted">A little progress makes a big difference.</div><div class="queueitem"><div class="tile">▤</div><div><b>Applications to approve</b><small>Review new student applications</small></div><span class="count">18</span></div><div class="queueitem"><div class="tile">▧</div><div><b>Open support tickets</b><small>Keep conversations moving</small></div><span class="count">12</span></div><div class="queueitem"><div class="tile">▣</div><div><b>Overdue student fees</b><small>Follow up on pending payments</small></div><span class="count">07</span></div><button class="btn soft" style="width:100%;margin-top:10px" onclick="go('tickets-all')">View all tasks →</button></div></div><div class="card panel" style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>Recent students</h3><div class="muted">Latest student records</div></div><button class="btn" onclick="go('students-all')">View all students →</button></div><div id="recent"></div></div>`;document.getElementById('recent').innerHTML=tableHTML('students',db.students.slice(0,3),false)}
function tableHTML(key,rows,actions=true){let heads=cfg[key]||[];return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}${actions?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${j===1&&['students','users','counselors'].includes(key)?`<div class="person"><span class="miniavatar">${String(v).split(' ').map(x=>x[0]).join('').slice(0,2)}</span>${v}</div>`:j===r.length-1?`<span class="pill ${/pending|progress|review|draft|offline|inactive/i.test(v)?'pending':/closed|inactive/i.test(v)?'closed':''}">${v}</span>`:v}</td>`).join('')}${actions?`<td><div class="rowactions"><button class="tiny" onclick="editRow('${key}',${i})">Edit</button><button class="tiny" onclick="deleteRow('${key}',${i})">Delete</button></div></td>`:''}</tr>`).join('')}</tbody></table>`}
function renderTable(p){let key=dataKey(),rows=db[key]||[],heads=cfg[key]||[];let tabs=p[1]==='Email'?['Inbox','Sent','Compose','Spam','Trash','Config','Templates']:p[1]==='Blog'?['All posts','Create new','SEO']:p[1]==='Pages'?['All pages','New page','SEO']:p[1]==='Student list'?['All students','Edit profile','Payment','Update']:p[1]==='Counselor'?['All counselors','Student list','Update','Bill','Email']:p[1]==='Accounts'?['Dashboard','Bill','Email','Student fee']:[];let tabhtml=tabs.length?`<div class="tabs">${tabs.map((t,i)=>`<button class="${t===p[3]?'active':''}" onclick="go('${pages.find(x=>x[1]===p[1]&&x[3]===t)?.[0]||current}')">${t}</button>`).join('')}</div>`:'';document.getElementById('content').innerHTML=`${head(p,`<button class="btn" onclick="exportCSV('${key}')">⇩ Export</button><button class="btn primary" onclick="openModal()">＋ ${key==='students'?'Add student':key==='posts'?'Create post':'Add new'}</button>`)}${tabhtml}<div class="card tablecard"><div class="tabletools"><input class="search" id="tableSearch" placeholder="Search records..." oninput="filterRows()"><select id="statusFilter" onchange="filterRows()"><option value="">All statuses</option>${[...new Set(rows.map(r=>r[r.length-1]))].map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" onclick="filterRows()">⚑ Filter</button><span class="spacer"></span><span class="muted" id="rowCount">${rows.length} records</span></div><div id="tableWrap">${tableHTML(key,rows)}</div><div class="pagination"><span id="pageInfo">Showing ${rows.length} records · Page 1 of 1</span><div><button class="btn" onclick="notify('You are on the first page')">Previous</button> <button class="btn" onclick="notify('All records are displayed')">Next</button></div></div></div>`}
function filterRows(){let key=dataKey(),q=(document.getElementById('tableSearch')?.value||'').toLowerCase(),s=document.getElementById('statusFilter')?.value||'',rows=(db[key]||[]).filter(r=>r.join(' ').toLowerCase().includes(q)&&(!s||r[r.length-1]===s));document.getElementById('tableWrap').innerHTML=tableHTML(key,rows);document.getElementById('rowCount').textContent=rows.length+' records';document.getElementById('pageInfo').textContent=`Showing ${rows.length} records · Page 1 of 1`}
function renderSpecial(p){let title=p[3],body='';if(current==='email-compose'||current==='counselor-email'||current==='accounts-email'){body=`<div class="card panel"><h3>Compose email</h3><div class="formgrid" style="margin-top:18px"><div class="field full"><label>To</label><input placeholder="recipient@example.com"></div><div class="field full"><label>Subject</label><input placeholder="Email subject"></div><div class="field full"><label>Message</label><textarea placeholder="Write your message..."></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="notify('Draft saved')">Save draft</button><button class="btn primary" onclick="notify('Demo email sent successfully')">Send email ↗</button></div></div>`}else if(current==='blog-create'||current==='pages-new'){body=`<div class="card panel"><h3>${title} editor</h3><div class="formgrid" style="margin-top:18px"><div class="field full"><label>Title</label><input placeholder="Enter title"></div><div class="field full"><label>Slug / URL</label><input placeholder="page-url-slug"></div><div class="field full"><label>Content</label><textarea style="min-height:220px" placeholder="Start writing your content..."></textarea></div><div class="field"><label>Status</label><select><option>Draft</option><option>Published</option></select></div><div class="field"><label>Category</label><input placeholder="General"></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="notify('Draft saved')">Save draft</button><button class="btn primary" onclick="notify('Published in demo')">Publish</button></div></div>`}else if(current==='chat-live'||current==='chat-resource'){body=`<div class="card panel"><h3>Live support workspace</h3><p class="muted">Demo conversation panel</p><div style="background:#fafbfc;border-radius:10px;padding:20px;min-height:230px;margin:16px 0"><p><b>Student · 10:42 AM</b><br><span class="muted">Hello, I need help with my application status.</span></p><p style="text-align:right"><b>Support · 10:44 AM</b><br><span class="muted">Of course! Let me check that for you.</span></p></div><div style="display:flex;gap:8px"><input class="search" style="flex:1" id="chatmsg" placeholder="Type a message..."><button class="btn primary" onclick="sendChat()">Send</button></div></div>`}else if(current==='settings-general'){body=`<div class="card panel"><h3>General settings</h3><div class="formgrid" style="margin-top:18px"><div class="field"><label>Workspace name</label><input value="Admin panel"></div><div class="field"><label>Support email</label><input value="support@example.com"></div><div class="field"><label>Timezone</label><select><option>Asia/Dhaka (GMT+6)</option><option>UTC</option></select></div><div class="field"><label>Default currency</label><select><option>BDT — Bangladeshi Taka</option><option>USD</option></select></div></div><button class="btn primary" style="margin-top:20px" onclick="notify('Settings saved locally')">Save changes</button></div>`}else if(current==='users-role'){body=`<div class="card panel"><h3>Role & permissions</h3>${['Super admin','Administrator','Counselor','Content editor','Support staff'].map((x,i)=>`<div class="queueitem"><div><b>${x}</b><small>${['Full access to all modules','Manage workspace and team','Manage assigned students','Manage blog and pages','Manage support tickets'][i]}</small></div><span class="spacer"></span><button class="btn" onclick="notify('Permission editor opened')">Configure</button></div>`).join('')}</div>`}else{body=`<div class="card panel"><h3>${title}</h3><p class="muted">Select a record from the relevant list to view and update its details.</p><button class="btn primary" onclick="go('students-all')">Open student records</button></div>`}document.getElementById('content').innerHTML=head(p)+body}
function sendChat(){let el=document.getElementById('chatmsg');if(el.value.trim()){notify('Message sent in demo chat');el.value=''}}
function openModal(key=dataKey(),idx=null){let row=idx===null?[]:db[key][idx],fields=cfg[key]||['Name','Email','Status'];document.getElementById('modal').innerHTML=`<h2>${idx===null?'Add new record':'Edit record'}</h2><p>Changes are saved in this browser demo.</p><form id="recordForm" onsubmit="saveRecord(event,'${key}',${idx===null?'null':idx})"><div class="formgrid">${fields.map((f,i)=>`<div class="field ${i===1?'full':''}"><label>${f}</label>${f.toLowerCase().includes('status')||f.toLowerCase().includes('availability')||f.toLowerCase().includes('priority')?`<select name="f${i}">${['Active','Pending','In progress','Approved','Rejected','Available','Offline','Open','Closed','Draft','Published','Paid','Unpaid'].map(v=>`<option ${row[i]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="f${i}" value="${row[i]||''}" placeholder="Enter ${f.toLowerCase()}" ${i===0?'required':''}>`}</div>`).join('')}</div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save record</button></div></form>`;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}function saveRecord(e,key,idx){e.preventDefault();let vals=[...new FormData(e.target).values()];if(idx===null)db[key].unshift(vals);else db[key][idx]=vals;save();closeModal();render();notify(idx===null?'Record added successfully':'Record updated successfully')}
function editRow(key,i){openModal(key,i)}function deleteRow(key,i){if(confirm('Delete this record?')){db[key].splice(i,1);save();render();notify('Record deleted')}}
function exportCSV(key){let rows=[cfg[key],...(db[key]||[])],csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=key+'-demo.csv';a.click();URL.revokeObjectURL(a.href);notify('CSV exported')}
buildNav();render();
</script></body></html>
