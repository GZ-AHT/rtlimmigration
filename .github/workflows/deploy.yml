
name: RTL Immigration - CI/CD

on:
  workflow_dispatch:

jobs:
  ssh-test:
    name: Test cPanel SSH Connection
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts

          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          EXPECTED="SHA256:vRHH6Q/FXZJ5uC3llJ6O55L+UHd+MIUjmo65OwefUms"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "SSH fingerprint verification failed!"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts
          echo "SSH fingerprint verified."

      - name: Test SSH login
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'whoami && php -v && git --version'
